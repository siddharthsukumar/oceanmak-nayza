[build]
  command = "npm run build"
  publish = "dist"

# No catch-all rewrite: unknown URLs fall through to dist/404.html, which
# Netlify serves with a real 404 status (avoids soft 404s in Google).

# Vite fingerprints everything in /assets, so it is safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
